esphome:
  name: domus-line-example

esp32:
  board: esp32dev
  framework:
    type: esp-idf

external_components:
  - source:
      type: local
      path: ./
    components: [domusline]

logger:

spi:
  clk_pin: 18
  mosi_pin: 23
  miso_pin: 19

light:
  - platform: domusline
    output_id: domusline_radio
    name: "Domus Line"
    cs_pin: 5
    ready_pin: 19
    gdo0_pin: 4

api:
  actions:
    - action: test_domusline_command
      description: Send a raw Domus Line opcode for protocol testing
      variables:
        opcode: int
        argument: int
        repetitions: int
      then:
        - lambda: id(domusline_radio).send_test_command(opcode, argument, repetitions);
